apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: catalog-db-secrets
  namespace: default
spec:
  provider: aws
  parameters:
    region: us-west-2
    usePodIdentity: "true"
    objects: |
      - objectName: "catalog-db-secret-1"
        objectType: "secretsmanager"
        jmesPath:
          - path: "MYSQL_USER"
            objectAlias: "MYSQL_USER"
          - path: "MYSQL_PASSWORD"
            objectAlias: "MYSQL_PASSWORD"
  secretObjects:
    - secretName: catalog-db-secret-sync
      type: Opaque
      data:
        - objectName: "catalog-db-secret-1"
          key: MYSQL_USER
        - objectName: "catalog-db-secret-1"
          key: MYSQL_PASSWORD
